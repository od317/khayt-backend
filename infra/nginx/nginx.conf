# خيط — Nginx config for the production API.
#
# Proxies /api/* to the api container. Two SSE locations need special
# handling — Nginx buffers responses by default, which breaks SSE.
#
# TODO: SSL. This config only serves HTTP on :80. Put Certbot or a
# reverse proxy (Caddy, Cloudflare, etc.) in front, or terminate TLS
# here once certificates exist. The app itself does not care.

upstream khayt_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # ------------------------------------------------------------
    # SSE — notifications stream
    # ------------------------------------------------------------
    # Buffering must be off, or events sit in Nginx's buffer and never
    # reach the client until the connection closes.
    location = /api/notifications/stream {
        proxy_pass http://khayt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ------------------------------------------------------------
    # SSE — order status stream
    # ------------------------------------------------------------
    # Path is /api/orders/<id>/stream — needs a regex because of the id.
    location ~ ^/api/orders/[^/]+/stream$ {
        proxy_pass http://khayt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ------------------------------------------------------------
    # Everything else under /api/
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://khayt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------
    # Anything else — return 404. No static files served from here.
    # ------------------------------------------------------------
    location / {
        return 404;
    }
}