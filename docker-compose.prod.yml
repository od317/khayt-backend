services:
  postgres:
    image: postgres:16-alpine
    container_name: khayt-db-prod
    environment:
      POSTGRES_USER: khayt
      POSTGRES_PASSWORD: khayt_prod_local
      POSTGRES_DB: khayt
    volumes: ['pgdata_prod:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U khayt']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: khayt-redis-prod
    volumes: ['redisdata_prod:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/od317/khayt-backend:latest
    container_name: khayt-api-prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env.production
    expose: ['3000']
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: khayt-nginx-prod
    # 443 only after TLS certs are configured; bare 443 was resetting clients.
    ports: ['80:80']
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata_prod:
  redisdata_prod:
