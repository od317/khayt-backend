services:
  postgres:
    image: postgres:16-alpine
    container_name: khayt-db
    environment:
      POSTGRES_USER: khayt
      POSTGRES_PASSWORD: khayt_dev
      POSTGRES_DB: khayt
    # Host 5433: a local PostgreSQL service already occupies 5432 on this machine.
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khayt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: khayt-redis
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
